name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # The root `yarn build` stops at apps/mobile, which has no build script,
      # so each workspace is built explicitly. The packages go first because
      # the web app resolves @bongo-ai/ui-components from its dist.
      - name: Build
        run: |
          for workspace in i18n shared ui-components web desktop \
            api-gateway auth-service content-service ai-service analytics-service; do
            yarn workspace "@bongo-ai/$workspace" build
          done

      - name: Test
        run: yarn test
